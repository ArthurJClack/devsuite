name: release
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: check
        run: |
          go vet ./...
          node --check web/app.js
          tests/e2e.sh
          tests/update.sh
      - name: build
        run: |
          V=${GITHUB_REF_NAME}
          mkdir dist
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -X main.version=$V" -o dist/hq.exe .
          GOOS=darwin  GOARCH=arm64 go build -ldflags "-s -w -X main.version=$V" -o dist/hq-macos .
          GOOS=linux   GOARCH=amd64 go build -ldflags "-s -w -X main.version=$V" -o dist/hq-linux .
          cp install.bat dist/
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            **install (windows):** download `hq.exe` and double-click it, or run in powershell:
            `irm https://raw.githubusercontent.com/ArthurJClack/devsuite/main/install.ps1 | iex`
            already have hq? it updates itself.
