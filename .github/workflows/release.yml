name: release
on:
  push:
    tags: ['v*', '[0-9]*']
  release:
    types: [published, edited]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag to build for (e.g. 0.1.0), blank = just test'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: check
        run: |
          go vet ./...
          node --check web/app.js
          tests/e2e.sh
          tests/update.sh
      - name: build
        run: |
          V="${{ github.event.release.tag_name || inputs.tag || github.ref_name }}"
          echo "TAG=$V" >> "$GITHUB_ENV"
          mkdir dist
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -X main.version=$V" -o dist/hq.exe .
          GOOS=darwin  GOARCH=arm64 go build -ldflags "-s -w -X main.version=$V" -o dist/hq-macos .
          GOOS=linux   GOARCH=amd64 go build -ldflags "-s -w -X main.version=$V" -o dist/hq-linux .
          cp install.bat dist/
      - name: release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
