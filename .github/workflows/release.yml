name: release
on:
  push:
    tags: ['v*', '[0-9]*']
    # releasing without a tag: bump VERSION on main and push. that's how claude ships hq
    # (its sessions can push commits but not tags). an already-released version is skipped.
    branches: [main]
    paths: [VERSION]
  release:
    types: [published, edited]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag to build for (e.g. 0.1.0), blank = just test'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: version from VERSION file
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d ' \n\r' < VERSION)
          if gh release view "$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$V is already released, nothing to do"; echo "SKIP=1" >> "$GITHUB_ENV"
          else
            echo "releasing $V"; echo "FROM_VERSION=$V" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-go@v5
        if: env.SKIP != '1'
        with:
          go-version: '1.24'
      - name: check
        if: env.SKIP != '1'
        run: |
          go vet ./...
          node --check web/app.js
          tests/e2e.sh
          tests/update.sh
          tests/life.sh
      - name: build
        if: env.SKIP != '1'
        run: |
          V="${{ env.FROM_VERSION || github.event.release.tag_name || inputs.tag || github.ref_name }}"
          echo "TAG=$V" >> "$GITHUB_ENV"
          mkdir dist
          # exe icon + version info (makes defender and windows treat it like a normal app)
          N=$(echo "${V#v}" | grep -Eo '^[0-9]+(\.[0-9]+){0,2}' || echo 0.0.0)
          go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64 --icon winres/icon.png --manifest cli \
            --product-name "hq" --file-description "fish market studios hq" --company-name "fish market studios" \
            --copyright "fish market studios" --original-filename hq.exe --product-version "$N.0" --file-version "$N.0" \
            || echo "::warning::go-winres failed, building without version info"
          GOOS=windows GOARCH=amd64 go build -ldflags "-X main.version=$V -H windowsgui" -o dist/hq.exe .
          GOOS=darwin  GOARCH=arm64 go build -ldflags "-X main.version=$V" -o dist/hq-macos .
          GOOS=linux   GOARCH=amd64 go build -ldflags "-X main.version=$V" -o dist/hq-linux .
          cp install.bat dist/
      - name: release
        if: env.SKIP != '1' && (env.FROM_VERSION != '' || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: dist/*
