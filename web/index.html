<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hq · fish market studios</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='%23ff7a59' d='M1 8c3-5 8-5 11 0-3 5-8 5-11 0zm11 0 3-3v6z'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand">
      <svg viewBox="0 0 64 32" class="fish" aria-hidden="true"><path d="M4 16C14 2 34 2 46 16 34 30 14 30 4 16Z"/><path d="M46 16 60 5v22Z"/><circle cx="14" cy="14" r="2.4" class="eye"/><path d="M24 8c3 5 3 11 0 16" class="gill"/></svg>
      <div><b id="studioName">fish market studios</b><small>hq</small></div>
    </div>
    <nav id="nav">
      <a data-page="dash">dashboard</a>
      <a data-page="games">games</a>
      <a data-page="board">board</a>
      <a data-page="chat">chat <i id="unread"></i></a>
      <a data-page="team">team</a>
      <a data-page="settings">settings</a>
    </nav>
    <div class="side-foot">
      <button id="jobsBtn" class="ghost small" title="console">console <i id="jobDot"></i></button>
      <div id="meBox"></div>
    </div>
  </aside>

  <main id="main">
    <div id="banner"></div>
    <section class="page" id="page-dash"></section>
    <section class="page" id="page-games"></section>
    <section class="page" id="page-board"></section>
    <section class="page" id="page-chat"></section>
    <section class="page" id="page-team"></section>
    <section class="page" id="page-settings"></section>
  </main>
</div>

<div id="console" class="hidden">
  <header><b id="conTitle">console</b><span id="conState"></span><button class="ghost small" id="conClose">close</button></header>
  <pre id="conLog"></pre>
</div>

<div id="modal" class="hidden"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
